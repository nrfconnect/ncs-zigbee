# Workaround: disable memory guard to avoid false faults after boot.
CONFIG_HW_STACK_PROTECTION=n

# MCUboot fprotect fails on nRF52840 with ext-flash FOTA layout (ACL region setup).
CONFIG_FPROTECT=n

CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
