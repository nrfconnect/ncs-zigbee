name: zigbee_fota_mcuboot_ext_flash
append:
  EXTRA_CONF_FILE: zigbee_fota_mcuboot_ext_flash.conf
boards:
  nrf52840dk/nrf52840:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf52840dk_nrf52840.overlay
      EXTRA_CONF_FILE: nrf52840dk_nrf52840.conf
  nrf5340dk/nrf5340/cpuapp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf5340dk_nrf5340_cpuapp.overlay
  nrf54l15dk/nrf54l15/cpuapp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf54l15dk_nrf54l15_cpuapp.overlay
      EXTRA_CONF_FILE: nrf54l15dk_nrf54l15_cpuapp.conf
  nrf54l15dk/nrf54l10/cpuapp:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf54l15dk_nrf54l10_cpuapp.overlay
      EXTRA_CONF_FILE: nrf54l15dk_nrf54l10_cpuapp.conf
  /nrf54lm20dk/nrf54lm20[ab]/cpuapp/:
    append:
      EXTRA_DTC_OVERLAY_FILE: boards/nrf54lm20dk_nrf54lm20a_cpuapp.overlay
      EXTRA_CONF_FILE: nrf54lm20dk_nrf54lm20a_cpuapp.conf
