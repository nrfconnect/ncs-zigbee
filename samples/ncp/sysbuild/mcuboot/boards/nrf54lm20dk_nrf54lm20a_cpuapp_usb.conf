# MCUboot implements the USB DFU class only on top of the legacy USB device
# stack, whose DWC2 driver claims the nRF54LM20 USBHS node without driving its
# wrapper, so the DFU interface never enumerates and the application can no
# longer bring up its own CDC ACM port.
CONFIG_BOOT_USB_DFU_NO=y
